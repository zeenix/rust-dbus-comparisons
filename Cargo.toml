[package]
name = "dbus_benches"
version = "0.1.0"
authors = ["Moritz Borcherding <moritz.borcherding@web.de>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-std = "1.13.2"
async-rustbus = "0.1.2"
rustbus = "0.19.3"
dbus = "0.9.11"

dbus-bytestream = "0.1.4"
dbus-serialize = "0.1.2"

serde = "1.0.228"
zbus = "5"

dbus-pure = {git = "https://github.com/Arnavion/dbus-pure", rev = "d0f0de3ce6759eb84b80851f2ee19e385d9281aa"}

dbus-message-parser = "4.3.1"
bytes = "1"

dbus-native = {git = "https://github.com/diwic/dbus-rs", rev = "eb330f7e4194dca8e1391e2b842861f204fc46ee"}

glib = "0.20"
gio = "0.20"

[dev-dependencies]
criterion = "0.4"

[[bench]]
name = "marshal_bench"
harness = false
